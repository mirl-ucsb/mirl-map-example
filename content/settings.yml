title: "The Managed Edge"
subtitle: "A walk where UC Santa Barbara meets the Pacific"
intro: "A short walk along the southern edge of UC Santa Barbara, where the campus gives way to bluff, chaparral, and the sea. These photographs return to that seam across a few years and seasons: an entrance monument, a warning sign at a slipping cliff, a storage container left on the sand, the Channel Islands held on the horizon. Read it as a map, or top to bottom as a walk."
about: "A short documentary walk along the coastal edge of UC Santa Barbara, by Jeff O'Brien. Built with MIRL Map, a documentary photo-map platform from the Material / Image Research Lab, UC Santa Barbara."
credit: "Photographs and text by Jeff O'Brien, Material / Image Research Lab, UC Santa Barbara."
