    <circle cx="43" cy="41" r="11" fill="#ff4d6a" fill-opacity=".5"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#1d1b18" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="2.2" fill="#1d1b18"/>
</svg>
